version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /e2e/apps/tenantshop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
  - package-ecosystem: docker
    directory: /e2e/apps/tenantshop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
