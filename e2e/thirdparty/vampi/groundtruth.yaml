- id: VAMPI-C-DELETE-USER
  name: Delete user is admin-only (normal user rejected)
  category: control
  authz: true
  endpoint: DELETE /users/v1/{username}
  relationship: same_role_other_user
  vulnerable_1: deny
  vulnerable_0: deny
  probe: delete_other
  source: api_views/users.py:delete_user (user.admin check, 401 "Only Admins may delete users!")

- id: VAMPI-C-DELETE-ANON
  name: Delete user without token is rejected
  category: control
  authz: true
  endpoint: DELETE /users/v1/{username}
  relationship: anonymous
  vulnerable_1: deny
  vulnerable_0: deny
  probe: delete_anon
  source: openapi3.yml security bearerAuth

