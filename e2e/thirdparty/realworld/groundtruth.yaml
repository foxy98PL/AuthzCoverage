# Ground truth for the RealWorld backend kivio/golang-echo-realworld (image digest in compose.yaml), judged against the
# official RealWorld API spec (openapi.yaml). The app's source is not vendored here; the labels come from OBSERVED
# behaviour: the recorder's tagged probes were run on the real stack and every label below matches the probe status
# printed in the results ("extra.runs[].probes"), plus the spec (which operations require the Token security scheme
# and which are public). Labels were written after looking at the observed statuses and were not tuned toward any score.
#
# Result of the observation: this backend enforces object ownership on every mutating article/comment endpoint
# (other user -> 404 resource not found on PUT/DELETE article; 401 unauthorized action on DELETE comment) and requires
# a token on all write endpoints. There is NO real authorization failure to find, so the suite has no authz:true
# "allow" item: it measures false positives (cells where a read or a social action by another user returns 2xx by
# design) and true negatives (denied cells that are not flagged). Recall is undefined (no expected true positive).
#
# Flat subset of YAML (one "- id:" block per item), parsed by the runner.
#   authz: true  = the cell is a real authorization boundary here (a 2xx would be a failure)
#   authz: false = a 2xx that is not an authorization failure (a flag here is a false positive)
#   category: control | quirk
#     control  forbidden for the caller in this app (a flag here is a false positive)
#     quirk    2xx that is by design (public read, social action), not an authorization failure
#   expect: deny (401/403/404) | noop (2xx that is not an authz failure)
#   probe: step tag in the recorder that exercises the item

# ---- Controls: object ownership is enforced (a flag here is a false positive) ----
- id: RW-C1-ARTICLE-PUT
  name: Update of another user's article is refused (404 resource not found)
  category: control
  authz: true
  endpoint: PUT /articles/{slug}
  relationship: same_role_other_user
  expect: deny
  probe: article_put_other
  source: observed probe status 404 for bob->alice and alice->bob; the app looks the article up by slug AND author id

- id: RW-C2-ARTICLE-DEL
  name: Delete of another user's article is refused (404 resource not found)
  category: control
  authz: true
  endpoint: DELETE /articles/{slug}
  relationship: same_role_other_user
  expect: deny
  probe: article_del_other
  source: observed probe status 404 both ways; same lookup by slug and author id

- id: RW-C3-COMMENT-DEL
  name: Delete of another user's comment is refused (401 unauthorized action)
  category: control
  authz: true
  endpoint: DELETE /articles/{slug}/comments/{id}
  relationship: same_role_other_user
  expect: deny
  probe: comment_del_other
  source: observed probe status 401 both ways; the handler compares the comment author with the caller


# ---- Anonymous callers on endpoints with the Token security scheme (spec) ----
- id: RW-C4-ARTICLE-PUT-ANON
  name: Anonymous update of an article is refused
  category: control
  authz: true
  endpoint: PUT /articles/{slug}
  relationship: anonymous
  expect: deny
  probe: article_put_anon
  source: spec security: Token; observed 401

- id: RW-C5-ARTICLE-DEL-ANON
  name: Anonymous delete of an article is refused
  category: control
