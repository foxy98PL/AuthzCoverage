  expect: deny
  probe: follow_anon
  source: spec security: Token; observed 401


# ---- Quirks: 2xx by design, not an authorization failure (a flag here is a false positive) ----
- id: RW-Q1-ARTICLE-GET
  name: Articles are public: any user reads any article
  category: quirk
  authz: false
  endpoint: GET /articles/{slug}
  relationship: same_role_other_user
  expect: noop
  probe: article_get_other
  source: spec: GET /articles/{slug} has no security requirement; observed 200 both ways

- id: RW-Q2-ARTICLE-GET-ANON
  name: Articles are public: anonymous reads any article
  category: quirk
  authz: false
  endpoint: GET /articles/{slug}
  relationship: anonymous
  expect: noop
  probe: article_get_anon
  source: spec: no security requirement; observed 200

- id: RW-Q3-COMMENTS-GET
  name: Comments are public: any user reads them
  category: quirk
  authz: false
  endpoint: GET /articles/{slug}/comments
  relationship: same_role_other_user
  expect: noop
  probe: comments_get_other
  source: spec: no security requirement; observed 200 both ways

- id: RW-Q4-COMMENTS-GET-ANON
  name: Comments are public: anonymous reads them
  category: quirk
  authz: false
  endpoint: GET /articles/{slug}/comments
  relationship: anonymous
  expect: noop
  probe: comments_get_anon
  source: spec: no security requirement; observed 200

- id: RW-Q5-FAVORITE-OTHER
  name: Favoriting another user's article is the feature (a favorite belongs to the caller, the author's object is unchanged)
  category: quirk
  authz: false
  endpoint: POST /articles/{slug}/favorite
  relationship: same_role_other_user
  expect: noop
  probe: favorite_other
  source: observed 200 both ways

- id: RW-Q6-UNFAVORITE-OTHER
  name: Un-favoriting another user's article only changes the caller's own favorite
  category: quirk
  authz: false
  endpoint: DELETE /articles/{slug}/favorite
  relationship: same_role_other_user
  expect: noop
  probe: unfavorite_other
  source: observed 200 both ways; a no-op for the author

- id: RW-Q7-COMMENT-POST-OTHER
  name: Commenting on another user's article is the feature (the comment belongs to the commenter)
  category: quirk
  authz: false
  endpoint: POST /articles/{slug}/comments
  relationship: same_role_other_user
  expect: noop
  probe: comment_post_other
  source: observed 201 both ways
