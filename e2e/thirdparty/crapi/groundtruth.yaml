# Ground truth for crAPI v1.1.6 (OWASP/crAPI, commit 700f03d, 2025-09-22). Derived from docs/challenges.md and
# docs/challengeSolutions.md at that tag plus the source of the services (paths below are relative to the repo
# root at that tag; abbreviations: ID = services/identity/src/main/java/com/crapi, WS = services/workshop/crapi),
# then confirmed by the runner's own probe statuses (see results "extra.runs[].probes").
#
# Flat subset of YAML (one "- id:" block per item), parsed by the runner.
#   authz: true  = authorization failure; authzcov is expected to flag it when it can
#   authz: false = not an authorization problem (out_of_scope for authzcov), or a 2xx that is not an authz failure
#   category: documented | undocumented | control | quirk | non_authz | query_param
#     documented   a crAPI challenge (docs/challenges.md) that is a path-parameter authorization failure
#     undocumented real authorization failure found by reading the source
#     query_param  BOLA/BFLA where the object is addressed by a query parameter. Since KAN-104 an operator can
#                  name it with requirements.overrides[].object_param, but the miss stays expected (counted as fn)
#                  until a crAPI run confirms detection; only then flip it to an expected true positive
#     control      forbidden for the caller in crAPI (a flag here is a false positive)
#     quirk        2xx that is not an authorization failure (a flag here is a false positive)
#     non_authz    other crAPI challenge classes (injection, SSRF, JWT, mass assignment, rate limit, LLM): out of scope
#   expect: what a forbidden caller gets (allow = 2xx with data/effect for the named victim, deny = 401/403/404,
#           noop = 2xx without effect on the victim)
#   probe: step tag in the recorder that exercises the item
#   miss: optional, the reason authzcov is expected to miss an authz item (used in the fn reason)

# ---- Documented authorization challenges (path parameter) ------------------
- id: CRAPI-C1-VEHICLE
  name: Challenge 1, BOLA - location and owner details of another user's vehicle
  category: documented
  authz: true
  endpoint: GET /identity/api/v2/vehicle/{vehicleId}/location
  relationship: same_role_other_user
  expect: allow
  probe: bola_vehicle
  # KAN-102: the flip to a true positive is expected but UNVERIFIED until the next crapi eval (docker) run.
  # KAN-102: identities.yaml marks the vehicles list rule exclusive (operator assertion), so ownership is learned and the cell is an expected true positive
  source: docs/challenges.md "Challenge 1"; ID/controller/VehicleController.java:getLocationBOLA (looks the vehicle up by uuid only, no owner check)

- id: CRAPI-C7-VIDEO
  name: Challenge 7, BFLA - delete another user's video through the admin endpoint
  category: documented
  authz: true
  endpoint: DELETE /identity/api/v2/admin/videos/{video_id}
  relationship: same_role_other_user
  expect: allow
  probe: bfla_video
  source: docs/challenges.md "Challenge 7"; ID/controller/ProfileController.java:deleteVideoBOLA and ID/service/Impl/ProfileServiceImpl.java:deleteAdminProfileVideo (no role or owner check; WebSecurityConfig only protects /identity/management/admin/**)

- id: CRAPI-C14-ORDER-ANON
  name: Challenge 14, unauthenticated access - order details readable without a token
  category: documented
  authz: true
  endpoint: GET /workshop/api/shop/orders/{order_id}
  relationship: anonymous
  expect: allow
  probe: order_anon
  source: docs/challenges.md "Challenge 14" names no endpoint; WS/shop/views.py:OrderControlView.get has no @jwt_auth_required (put/post/other views have it), which is the unauthenticated endpoint. The mapping of challenge 14 to this endpoint is ours.

# ---- Undocumented but real (found by reading the source) --------------------
- id: CRAPI-U1-ORDER-OTHER
  name: Order details of another user readable (BOLA)
  category: undocumented
  authz: true
  endpoint: GET /workshop/api/shop/orders/{order_id}
  relationship: same_role_other_user
  expect: allow
  probe: bola_order
  source: WS/shop/views.py:OrderControlView.get (Order.objects.get(id=order_id), never compares order.user with the caller; order ids are sequential integers)

- id: CRAPI-U2-USERS-ALL
  name: Management user list (e-mails, phone numbers, credit) readable by any customer
  category: undocumented
  authz: true
  endpoint: GET /workshop/api/management/users/all
  relationship: lower_role
  expect: allow
  probe: users_all_user
  source: WS/user/views.py:AdminUserView.get (only @jwt_auth_required, no role check). Function-level: no object parameter; identities.yaml declares min_role admin for it (operator-declared policy, not learned), so alice's 2xx is a lower_role suspicious_allow (expected true positive).

# ---- Query-parameter BOLA: expected misses (KAN-104 adds object_param on in:query; flip after a crAPI run) ----
- id: CRAPI-C2-REPORT
  name: Challenge 2, BOLA - mechanic report of another user (report_id query parameter)
  category: query_param
  authz: true
  endpoint: GET /workshop/api/mechanic/mechanic_report
  relationship: same_role_other_user
  expect: allow
  probe: report_other
  source: docs/challenges.md "Challenge 2"; WS/mechanic/views.py:GetReportView.get (ServiceRequest.objects.filter(id=report_id) with report_id from request.GET, no owner check)

# ---- Quirks: 2xx that is not an authorization failure ------------------------
- id: CRAPI-Q1-POST-OTHER
  name: Community posts are public by design (any user reads any post)
  category: quirk
  authz: false
  endpoint: GET /community/api/v2/community/posts/{postId}
  relationship: same_role_other_user
  expect: noop
  probe: post_other
  source: docs/overview.md (community section where users contribute blog posts and comments for everyone); services/community/api/controllers/post_controller.go:GetPostByID returns any post by id, by design of a public blog

- id: CRAPI-Q2-VIDEO-PUT
  name: Video update ignores the {video_id} path parameter (changes the caller's own video)
  category: quirk
  authz: false
  endpoint: PUT /identity/api/v2/user/videos/{video_id}
  relationship: same_role_other_user
  expect: noop
  probe: video_put_other
  source: ID/service/Impl/ProfileServiceImpl.java:updateProfileVideo (profileVideoRepository.findByUser_id(token user); the path id is not used), same pattern as VAmPI's email update

# ---- Controls: forbidden for the caller (a flag here is a false positive) ----
- id: CRAPI-C-VEHICLE-ANON
  name: Vehicle location without token is rejected
  category: control
  authz: true
  endpoint: GET /identity/api/v2/vehicle/{vehicleId}/location
  relationship: anonymous
  expect: deny
  probe: vehicle_anon
  source: ID/config/WebSecurityConfig.java (anyRequest().authenticated())

- id: CRAPI-C-ORDER-PUT-OTHER
  name: Order update of another user is refused (403)
  category: control
  authz: true
  endpoint: PUT /workshop/api/shop/orders/{order_id}
  relationship: same_role_other_user
  expect: deny
  probe: order_put_other
  source: WS/shop/views.py:OrderControlView.put (if user != order.user: 403)

- id: CRAPI-C-ORDER-PUT-ANON
  name: Order update without token is rejected
  category: control
  authz: true
  endpoint: PUT /workshop/api/shop/orders/{order_id}
  relationship: anonymous
  expect: deny
  probe: order_put_anon
  source: WS/shop/views.py (@jwt_auth_required on put)

- id: CRAPI-C-VIDEO-GET-OTHER
  name: Video of another user is not returned (404)
  category: control
  authz: true
  endpoint: GET /identity/api/v2/user/videos/{video_id}
  relationship: same_role_other_user
  expect: deny
  probe: video_get_other
  source: ID/service/Impl/ProfileServiceImpl.java:getProfileVideo (returns only the token user's own video, else VIDEO_NOT_FOUND 404)

- id: CRAPI-C-VIDEO-GET-ANON
  name: Video without token is rejected
  category: control
  authz: true
  endpoint: GET /identity/api/v2/user/videos/{video_id}
  relationship: anonymous
  expect: deny
  probe: video_get_anon
  source: ID/config/WebSecurityConfig.java (anyRequest().authenticated())

- id: CRAPI-C-VIDEO-DELETE-USER
  name: User video delete endpoint never deletes (hint "this is an admin function")
  category: control
  authz: true
  endpoint: DELETE /identity/api/v2/user/videos/{video_id}
  relationship: same_role_other_user
  expect: deny
  probe: video_delete_user
  source: ID/controller/ProfileController.java:deleteVideo (builds a 403 CRAPIResponse for an existing video, but the controller only maps status 200 to a 2xx, so the response is 404 in both cases; nothing is deleted)

- id: CRAPI-C-ADMIN-VIDEO-ANON
  name: Admin video delete without token is rejected
  category: control
  authz: true
  endpoint: DELETE /identity/api/v2/admin/videos/{video_id}
  relationship: anonymous
  expect: deny
  probe: admin_video_anon
  source: ID/config/WebSecurityConfig.java (anyRequest().authenticated())

- id: CRAPI-C-POST-ANON
  name: Community post without token is rejected
  category: control
  authz: true
  endpoint: GET /community/api/v2/community/posts/{postId}
  relationship: anonymous
  expect: deny
  probe: post_anon
  source: services/community/api/router/routes.go (SetMiddlewareAuthentication on GetPostByID)

